spring:
  application:
    name: demo-ai-es

  # carica .env (formato KEY=VALUE) come se fosse un properties file:
  # le chiavi API arrivano da li', mai hardcoded in questo file.
  # 'optional' = se il file non esiste l'app parte lo stesso (le chiavi si prendono dall'env).
  config:
    import: optional:file:.env[.properties]

  # lo starter umbrella spring-ai-starter-model-openai porta anche audio/image/moderation:
  # escludiamo le autoconfigurazioni non usate, cosi' bastano le due chiavi chat + embedding.
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

  ai:
    openai:
      chat:
        # Groq: API OpenAI-compatible, quindi stesso client, solo base-url e model diversi.
        # ATTENZIONE: base-url senza /v1, perche' il completions-path di default
        # (/v1/chat/completions) viene APPENDITO. Con /v1 dentro si ottiene
        # https://api.groq.com/openai/v1/v1/chat/completions -> 404.
        base-url: ${OPENAI_CHAT_BASE_URL:https://api.groq.com/openai}
        # fallback voluto: la chat e' opzionale. Senza OPENAI_CHAT_API_KEY l'app parte lo stesso
        # (ingest funziona) e solo /chat va in 401. Se la variabile fosse assente E vuota
        # l'assertion "api-key must be set" bloccherebbe l'avvio.
        api-key: ${OPENAI_CHAT_API_KEY:not-configured}
        # il path di default (/v1/chat/completions) e' gia' quello giusto per Groq.
        # se invece si mette /v1 dentro base-url, va annullato qui:
        # completions-path: /chat/completions
        options:
          model: ${OPENAI_CHAT_MODEL:openai/gpt-oss-120b}
          temperature: 0.2
      # embedding su Jina AI: stesso client OpenAI, endpoint /v1/embeddings di Jina
      embedding:
        base-url: ${JINA_BASE_URL:https://api.jina.ai}
        api-key: ${JINA_API_KEY}
        embeddings-path: /v1/embeddings
        options:
          model: ${JINA_EMBEDDING_MODEL:jina-embeddings-v5-omni-small}
          # vettore nativo da 1024 dim (Matryoshka: 32/64/128/256/512/768/1024).
          # se cambi modello (es. nano = 768) aggiorna anche ChunkDocument.EMBEDDING_DIMS
          dimensions: 1024

  elasticsearch:
    # container gia' running: docker.elastic.co/elasticsearch/elasticsearch:9.2.1
    # nome=elasticsearch, rete google-like-search_default, discovery.type=single-node,
    # xpack.security.enabled=false -> http in chiaro, nessuna credenziale.
    # se l'app gira in un container nella stessa rete: http://elasticsearch:9200
    uris: ${ELASTIC_URIS:http://localhost:9200}
    # username: elastic
    # password: changeme
    connection-timeout: 5s
    socket-timeout: 60s

app:
  elastic:
    index: chunks
  chunk:
    size: 800
    overlap: 100
    # quanti chunk per chiamata di embedding (i provider limitano input e token per richiesta)
    embed-batch-size: 64
  search:
    # top-k = quanti chunk finiscono nel contesto del LLM
    top-k: 5
    # num-candidates = quanti vettori ES valuta prima di ridurli a top-k (deve essere >= top-k)
    num-candidates: 50
    # soglia di rilevanza sul chunk piu' vicino: sotto questa, non si chiede niente
    # al LLM e si risponde con no-answer. Con similarity=cosine lo score kNN di ES e'
    # (1 + cos) / 2, quindi sta in 0-1 (la normalizzazione dei vettori non conta).
    # Valutata a mano su 11 sonde (5 con risposta, 6 senza): con risposta 0.79-0.92,
    # senza 0.69-0.73, quindi 0.76 le separa. DIPENDE dal modello di embedding:
    # cambiando modello, rimisurare.
    min-score: 0.76
    no-answer: "Non ho informazioni a riguardo."
    hybrid:
      # quanti risultati prende ciascuna lista (kNN e BM25) prima della fusione RRF;
      # >= top-k, e num-candidates deve essere >= rank-window
      rank-window: 20
      # costante k di RRF: score = 1 / (rrf-k + rank). 60 e' il valore standard
      # (lo stesso default di ES): piu' alto = meno peso alle prime posizioni
      rrf-k: 60
    lexical:
      # soglia della modalita' solo BM25, sullo score BM25 (non sul coseno kNN: scala diversa,
      # illimitata e dipendente da lunghezza del campo e frequenza dei termini nel corpus).
      # 0.0 = passa tutto quello che la query match ha trovato, che e' gia' una selezione.
      # Alzarla richiede di misurarla sul proprio corpus, come min-score.
      min-score: 0.0
    grouped:
      # quanti candidati da cui pescare i contentId prima di raggruppare;
      # deve essere <= num-candidates
      group-window: 50
      # quanti contentId distinti restituire al massimo
      max-groups: 10
      # quanti chunk di ogni documento finiscono nel contesto della risposta LLM
      chunks-per-group: 2
  agent:
    # cosa il tool RAG restituisce all'agente quando nessun chunk passa la soglia: NON e' una
    # risposta all'utente, e' un avviso al modello, che nel prompt e' istruito a dirlo e a non
    # inventare. Se qui scrivessi una risposta gia' fatta, l'agente la passerebbe come sua.
    empty-result: "Nessun chunk trovato in indice su questo argomento."
  http-log:
    # logga request/response HTTP di Spring AI su logger "http.request" (header Authorization mascherato).
    # metti false in produzione: il body contiene i testi inviati al provider.
    enabled: ${HTTP_LOG_ENABLED:true}

logging:
  level:
    org.springframework.ai: INFO
    http.request: ${HTTP_LOG_LEVEL:INFO}
